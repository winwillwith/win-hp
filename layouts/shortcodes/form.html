<form name="contact" action="https://getform.io/" method="POST" class="flex flex-col gap-4">
    <div style="display: none !important;" aria-hidden="true">
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off">
    </div>

    <div class="input">
        <input type="text" placeholder="お名前" name="name" maxlength="50" class="w-full p-4 bg-gray-200 border border-gray-200 focus:outline-none focus:bg-white focus:border-gray-500" required>
    </div>
    <div class="input">
        <input type="email" placeholder="メールアドレス" name="mail" class="w-full p-4 bg-gray-200 border border-gray-200 focus:outline-none focus:bg-white focus:border-gray-500" required>
    </div>
    <div class="input">
        <input type="text" placeholder="件名" name="title" class="w-full p-4 bg-gray-200 border border-gray-200 focus:outline-none focus:bg-white focus:border-gray-500" required>
    </div>
    <div class="input">
        <textarea rows="5" cols="30" placeholder="お問い合わせ内容" name="message" maxlength="2000" class="w-full p-4 bg-gray-200 border border-gray-200 focus:outline-none focus:bg-white focus:border-gray-500" required></textarea>
    </div>
    <input type="submit" value="送信" class="px-8 py-2 duration-200 bg-gray-800 text-white cursor-pointer transition-colors hover:bg-gray-400">
</form>
