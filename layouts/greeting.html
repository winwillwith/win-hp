{{ define "main" }}
<main class="max-w-4xl mx-auto px-6 py-12 md:py-16 text-gray-800">
    <!-- 代表挨拶カード領域 -->
    <article class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-12">
        <!-- Markdownコンテンツ（proseで文章余白・フォントサイズを自動調整） -->
        <div class="prose prose-lg max-w-none text-gray-700 leading-relaxed prose-headings:font-bold prose-headings:text-gray-900 prose-p:my-6 prose-strong:text-xl prose-strong:text-blue-900 prose-strong:block prose-strong:mb-8">
            {{ .Content }}
        </div>
    </article>
</main>
{{ end }}
